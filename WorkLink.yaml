openapi: 3.0.3
info:
  title: WorkLink API
  description: API de la aplicación de gestión WorkLink.
  version: 2.0.0

servers:
  - url: http://localhost:8081

paths:
  /users:
    get:
      tags:
        - Users
      summary: Devuelve la lista de usuarios
      description: |
        Devuelve una lista con todos los usuarios disponibles.

        Se permite filtrar usuarios por varios campos:
          - **email**: filtra por correo electrónico
          - **name**: filtra por nombre
          - **active**: filtra por si el usuario está activo
      parameters:
        - name: email
          in: query
          description: Filtra por correo electrónico del usuario
          required: false
          schema:
            type: string
        - name: name
          in: query
          description: Filtra por nombre del usuario
          required: false
          schema:
            type: string
        - name: active
          in: query
          description: Filtra según si el usuario está activo o no
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de usuarios devuelta correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserOutDto'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    post:
      tags:
        - Users
      summary: Registra un usuario
      description: Registra un nuevo usuario y lo relaciona con su rol correspondiente
      requestBody:
        required: true
        description: Datos del nuevo usuario
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInDto'
            example:
              name: Pedro
              email: pedro@worklink.com
              password: "12345678"
              phone: "123123123"
              active: true
              rolId: 2
      responses:
        '201':
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOutDto'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /users/{id}:
    get:
      tags:
        - Users
      summary: Devuelve un usuario por su id
      description: Devuelve un usuario específico mediante su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del usuario
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOutDto'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    put:
      tags:
        - Users
      summary: Modifica un usuario por su id
      description: Modifica los datos de un usuario específico mediante su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del usuario
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInDto'
            example:
              name: Pedro
              email: pedro@email.com
              password: "12345678"
              phone: "999999999"
              active: true
              rolId: 2
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOutDto'
        '400':
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: Conflicto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    delete:
      tags:
        - Users
      summary: Elimina un usuario por su id
      description: Elimina un usuario específico mediante su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del usuario
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Usuario eliminado correctamente
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /login:
    post:
      tags:
        - Auth
      summary: Inicia sesión de usuario
      description: Autentica a un usuario mediante su correo electrónico y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInDto'
            example:
              email: pedro@worklink.com
              password: "contraseña1234"
      responses:
        '200':
          description: Inicio de sesión realizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutDto'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Usuario no encontrado o credenciales no válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /userBalances:
    get:
      tags:
        - UserBalances
      summary: Devuelve la lista de balances de usuario
      description: |
        Devuelve una lista con todos los balances de usuario disponibles.

        Se permite filtrar balances por varios campos:
          - **user_id**: filtra por identificador del usuario
          - **year**: filtra por año
      parameters:
        - name: user_id
          in: query
          required: false
          description: Filtra por identificador del usuario
          schema:
            type: integer
            format: int64
        - name: year
          in: query
          required: false
          description: Filtra por año del balance
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Lista de balances devuelta correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBalanceOutDto'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    post:
      tags:
        - UserBalances
      summary: Registra un balance de usuario
      description: Registra un nuevo balance asociado a un usuario
      requestBody:
        required: true
        description: Datos del nuevo balance de usuario
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBalanceInDto'
            example:
              userId: 2
              year: 2026
              vacationDays: 30
              excessDays: 5
              unpaidDays: 2
              hoursBalance: 24.0
      responses:
        '201':
          description: Balance de usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBalanceOutDto'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /userBalances/{id}:
    get:
      tags:
        - UserBalances
      summary: Devuelve un balance de usuario por su id
      description: Devuelve un balance de usuario específico mediante su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del balance de usuario
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Balance de usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBalanceOutDto'
        '404':
          description: Balance de usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    put:
      tags:
        - UserBalances
      summary: Modifica un balance de usuario por su id
      description: Modifica los datos de un balance de usuario específico mediante su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del balance de usuario
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBalanceInDto'
            example:
              userId: 2
              year: 2026
              vacationDays: 25
              excessDays: 4
              unpaidDays: 1
              hoursBalance: 20.0
      responses:
        '200':
          description: Balance de usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBalanceOutDto'
        '400':
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Balance de usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    delete:
      tags:
        - UserBalances
      summary: Elimina un balance de usuario por su id
      description: Elimina un balance de usuario específico mediante su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del balance de usuario
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Balance de usuario eliminado correctamente
        '404':
          description: Balance de usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /api/v1/rol:
    get:
      tags:
        - Roles
      summary: Devuelve la lista de roles
      description: |
        Devuelve una lista con todos los roles disponibles.

        Se permite filtrar roles por varios campos:
          - **name**: filtra por nombre del rol
          - **accessLevel**: filtra por nivel de acceso
          - **active**: filtra por si el rol está activo
      parameters:
        - name: name
          in: query
          required: false
          description: Filtra por nombre del rol
          schema:
            type: string
        - name: accessLevel
          in: query
          required: false
          description: Filtra por nivel de acceso del rol
          schema:
            type: number
            format: float
        - name: active
          in: query
          required: false
          description: Filtra según si el rol está activo o no
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de roles devuelta correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolOutDto'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    post:
      tags:
        - Roles
      summary: Registra un rol
      description: Registra un nuevo rol en el sistema
      requestBody:
        required: true
        description: Datos del nuevo rol
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolInDto'
            example:
              name: Encargado
              description: Responsable de supervisión y gestión
              accessLevel: 2.0
      responses:
        '201':
          description: Rol registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolOutDto'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /api/v2/rol:
    get:
      tags:
        - V2 Roles
      summary: Devuelve la lista de roles
      description: |
        Devuelve una lista con todos los roles disponibles.

        Se permite filtrar roles por varios campos:
          - **name**: filtra por nombre del rol con búsqueda parcial e ignora mayúsculas y minúsculas
          - **accessLevel**: filtra por nivel de acceso
          - **active**: filtra por si el rol está activo
      parameters:
        - name: name
          in: query
          required: false
          description: Filtra por nombre del rol (con busqueda parcial e ignorando mayúsculas y minúsculas)
          schema:
            type: string
        - name: accessLevel
          in: query
          required: false
          description: Filtra por nivel de acceso del rol
          schema:
            type: number
            format: float
        - name: active
          in: query
          required: false
          description: Filtra según si el rol está activo o no
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de roles devuelta correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolOutDto'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    post:
      tags:
        - V2 Roles
      summary: Registra un rol
      description: Registra un nuevo rol en el sistema, comprobando que no exista otro rol con el mismo nombre
      requestBody:
        required: true
        description: Datos del nuevo rol
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolInDto'
            example:
              name: Encargado
              description: Responsable de supervisión y gestión
              accessLevel: 2.0
      responses:
        '201':
          description: Rol registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolOutDto'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /api/v1/rol/{id}:
    get:
      tags:
        - Roles
      summary: Devuelve un rol por su id
      description: Devuelve un rol específico a partir de su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del rol
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Rol encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolOutDto'
        '404':
          description: Rol no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    put:
      tags:
        - Roles
      summary: Modifica un rol por su id
      description: Modifica los datos de un rol específico mediante su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del rol
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolInDto'
            example:
              name: Encargado
              description: Responsable de supervisión y coordinación
              accessLevel: 2.5
      responses:
        '200':
          description: Rol actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolOutDto'
        '400':
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Rol no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    delete:
      tags:
        - Roles
      summary: Elimina un rol por su id
      description: Elimina un rol específico mediante su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del rol
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Rol eliminado correctamente
        '404':
          description: Rol no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /api/v2/rol/{id}:
    put:
      tags:
        - V2 Roles
      summary: Modifica un rol por su id
      description: Modifica los datos de un rol específico mediante su identificador único, no podrá cambiar el nombre del rol si ya hay otro creado con el mismo
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del rol
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolInV2Dto'
            example:
              name: Encargado
              description: Responsable de supervisión y coordinación
              accessLevel: 2.5
      responses:
        '200':
          description: Rol actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolOutDto'
        '400':
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Rol no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    delete:
      tags:
        - V2 Roles
      summary: Elimina un rol por su id
      description: Realiza un borrado logico desactivando el rol sin llegar a eliminarlo del todo
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del rol
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Rol eliminado correctamente
        '404':
          description: Rol no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /turns:
    get:
      tags:
        - Turns
      summary: Devuelve la lista de turnos
      description: |
        Devuelve una lista con todos los turnos disponibles.

        Se permite filtrar turnos por varios campos:
          - **name**: filtra por nombre del turno
          - **color_hex**: filtra por color del turno
          - **nights**: filtra si el turno es nocturno
      parameters:
        - name: name
          in: query
          required: false
          description: Filtra por nombre del turno
          schema:
            type: string
        - name: color_hex
          in: query
          required: false
          description: Filtra por color hexadecimal del turno
          schema:
            type: string
        - name: nights
          in: query
          required: false
          description: Filtra según si el turno es nocturno
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de turnos devuelta correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TurnOutDto'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    post:
      tags:
        - Turns
      summary: Registra un turno
      description: Registra un nuevo turno en el sistema
      requestBody:
        required: true
        description: Datos del nuevo turno
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnInDto'
            example:
              name: Turno mañana
              description: Turno de trabajo de mañana
              workStart: "08:00:00"
              workEnd: "16:00:00"
              colorHex: "#4CAF50"
              nights: false
              active: true
      responses:
        '201':
          description: Turno registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnOutDto'
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /turns/{id}:
    get:
      tags:
        - Turns
      summary: Devuelve un turno por su id
      description: Devuelve un turno específico mediante su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del turno
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Turno encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnOutDto'
        '404':
          description: Turno no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    put:
      tags:
        - Turns
      summary: Modifica un turno por su id
      description: Modifica los datos de un turno específico mediante su identificador único
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del turno
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnInDto'
            example:
              name: Turno tarde
              description: Turno de trabajo de tarde
              workStart: "16:00:00"
              workEnd: "00:00:00"
              colorHex: "#FF9800"
              nights: true
              active: true
      responses:
        '200':
          description: Turno actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnOutDto'
        '400':
          description: Petición inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Turno no encontrado
