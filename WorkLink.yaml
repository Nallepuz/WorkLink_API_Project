components:
  schemas:
    User:
      allOf:
        - $ref: '#/components/schemas/UserInDto'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Identificador del usuario
            created:
              type: string
              format: date-time
              description: Fecha de creación del usuario
            updated:
              type: string
              format: date-time
              description: Fecha de actualización del usuario
          required:
            - id
            - created
            - updated
      example:
        id: 3
        name: Nero
        email: nero@worklink.com
        password: "1234"
        phone: "123456789"
        created: "2025-11-09T10:00:00"
        updated: "2025-11-21T12:30:00"
        active: true
        rolId: 1
    UserInDto:
      type: object
      properties:
        name:
          type: string
          description: Nombre del usuario
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
        password:
          type: string
          description: Contraseña del usuario
        phone:
          type: string
          description: Número de teléfono del usuario
        active:
          type: boolean
          description: Indica si el usuario sigue activo en la empresa
        rolId:
          type: integer
          format: int64
          description: Identificador del rol al que pertenece el usuario
      required:
        - name
        - email
        - password
        - phone
        - active
        - rolId
      example:
        name: Dante
        email: dante@worklink.com
        password: "7777"
        phone: "666666666"
        active: true
        rolId: 1
    UserOutDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Identificador del usuario
        name:
          type: string
          description: Nombre del usuario
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
        phone:
          type: string
          description: Número de teléfono del usuario
        created:
          type: string
          format: date-time
          description: Fecha de creación del usuario
        updated:
          type: string
          format: date-time
          description: Fecha de actualización del usuario
        active:
          type: boolean
          description: Indica si el usuario sigue activo en la empresa
        rolId:
          type: integer
          format: int64
          description: Identificador del rol al que pertenece el usuario
      required:
        - id
        - name
        - email
        - phone
        - created
        - updated
        - active
        - rolId
      example:
        id: 2
        name: Vergil
        email: vergil@worklink.com
        phone: "666666666"
        created: "2025-11-09T10:00:00"
        updated: "2025-11-21T12:30:00"
        active: true
        rolId: 1
    LoginInDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Correo electrónico del usuario que inicia sesión
        password:
          type: string
          description: Contraseña del usuario que inicia sesión
      required:
        - email
        - password
      example:
        email: dante@worklink.com
        password: Jackpot666
    LoginOutDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Correo electrónico del usuario autenticado
        password:
          type: string
          description: Contraseña del usuario autenticado
      required:
        - email
        - password
      example:
        email: dante@worklink.com
        password: "Jackpot666"


    UserBalance:
      allOf:
        - $ref: '#/components/schemas/UserBalanceInDto'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Identificador del balance de un usuario en un año
            created:
              type: string
              format: date-time
              description: Fecha de creación del balance del usuario
            updated:
              type: string
              format: date-time
              description: Fecha de actualización del balance del usuario
          required:
            - id
            - created
            - updated
      example:
        id: 1
        userId: 3
        year: 2026
        vacationDays: 40
        excessDays: 2
        unpaidDays: 2
        hoursBalance: 24
        created: "2025-11-09T10:00:00"
        updated: "2025-11-21T12:30:00"
    UserBalanceInDto:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: Identificador del usuario
        year:
          type: integer
          description: Año del balance del usuario
        vacationDays:
          type: integer
          description: Número de días de vacaciones del usuario
        excessDays:
          type: integer
          description: Número de días de exceso del usuario
        unpaidDays:
          type: integer
          description: Número de días no retribuidos del usuario
        hoursBalance:
          type: number
          format: float
          description: Número de bolsa de horas restante del usuario
      required:
        - userId
        - year
        - vacationDays
        - excessDays
        - unpaidDays
        - hoursBalance
      example:
        userId: 1
        year: 2026
        vacationDays: 40
        excessDays: 2
        unpaidDays: 2
        hoursBalance: 24
    UserBalanceOutDto:
      allOf:
        - $ref: '#/components/schemas/UserBalanceInDto'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: Identificador del balance de un usuario en un año
            userName:
              type: string
              description: Nombre del usuario al que pertenece el balance
            created:
              type: string
              format: date-time
              description: Fecha de creación del balance del usuario
            updated:
              type: string
              format: date-time
              description: Fecha de actualización del balance del usuario
          required:
            - id
            - created
            - updated
      example:
        id: 1
        userId: 3
        userName: Nero
        year: 2026
