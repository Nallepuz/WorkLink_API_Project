name: Postman integration tests
on:
  push:
    branches: [ "developer", "main", "master" ]
  pull_request:
    branches: [ "developer", "main", "master" ]

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: apiworklink_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Start Spring Boot app
        run: |
          ./mvnw spring-boot:run -Dspring-boot.run.profiles=ci > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8081/users >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 10
          done
          echo "API did not start in time"
          cat app.log
          exit 1

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        run: |
          newman run postman/WorkLink.postman_collection.json \
            -e postman/local.postman_environment.json

      - name: Show Spring Boot log on failure
        if: failure()
        run: cat app.log